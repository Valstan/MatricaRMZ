name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.26.1"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install

      # ESLint runs without type-aware rules (no `project` in eslint.config.mjs),
      # so no package build is required — unlike the typecheck workflow.
      # Per-package `lint` scripts pin `--max-warnings 0`: the repo is at zero
      # warnings, so any newly-introduced warning (not just errors) fails the job.
      - name: Lint
        run: pnpm -r lint

  # The encrypted backup is the only copy of the ledger, and its failure mode is silence —
  # so it gets a gate of its own. The smoke test runs the real script against a fixture
  # ledger with shimmed pg_dump/curl and `--no-upload` (no network, no Yandex.Disk).
  prod-ops-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Backup script smoke test
        run: bash scripts/prod-ops/backup-encrypted.test.sh
