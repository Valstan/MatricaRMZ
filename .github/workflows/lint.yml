name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.26.1"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install

      # ESLint runs without type-aware rules (no `project` in eslint.config.mjs),
      # so no package build is required — unlike the typecheck workflow.
      # Per-package `lint` scripts pin `--max-warnings 0`: the repo is at zero
      # warnings, so any newly-introduced warning (not just errors) fails the job.
      - name: Lint
        run: pnpm -r lint

  # The encrypted backup is the only copy of the ledger, and its failure mode is silence —
  # so it gets a gate of its own. The smoke test runs the real script against a fixture
  # ledger with shimmed pg_dump/curl and `--no-upload` (no network, no Yandex.Disk).
  prod-ops-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Backup script smoke test
        run: bash scripts/prod-ops/backup-encrypted.test.sh

      # Тот же класс: еженедельный аудит зависимостей — единственный, кто сообщает о находках,
      # и он уже писал «alert sent» при выключенном Telegram. Смоук держит и это, и то, что
      # список принятых находок не может стать вечным глушителем.
      - name: Deps audit script smoke test
        run: bash scripts/prod-ops/audit-deps.test.sh

      # Выкат бэкенда — самый дорогой отказ из ops-скриптов: он бьёт ровно в тот день, когда
      # нужна способность выкатывать. Смоук держит откат, отказ до `rm -rf` при неустановленной
      # рантаймовой зависимости и ширину окна ожидания primary (канон: не меньше 90 с).
      - name: Backend deploy script smoke test
        run: bash scripts/prod-ops/deploy-backend.test.sh

      # Выкат артефактов клиента: скрипт кладёт на прод то, что потом раздаёт всему парку.
      # Прежняя версия сверяла размеры манифеста и blockmap КОНСТАНТАМИ прошлого релиза —
      # на любом новом релизе сверка была ложной. Смоук держит сверку по манифесту и по
      # цифрам релиза и то, что в прод уходит только согласованная тройка.
      - name: Client artifacts fetch script smoke test
        run: bash scripts/prod-ops/fetch-client-artifacts.test.sh

      # Замер пика памяти агента MiniMax Code: бокс 1536 МБ без swap, и два агента разом =
      # OOM-killer снимает крупнейший процесс. Смоук держит три исхода, которые нельзя
      # перепутать: замер посчитан по сэмплам, пустой пул отличается от ответа агента,
      # а снятый ядром процесс показан в отчёте и не выдаётся за успех.
      - name: MiniMax worker RAM measurement smoke test
        run: bash scripts/prod-ops/measure-minimax-worker-ram.test.sh

      # Пин адресов MiniMax в /etc/hosts: скрипт пишет в системный файл на боксе, и его
      # ошибка выглядит как «агент не доходит до MiniMax» — без сообщения об ошибке.
      # Прежняя версия выкидывала только заголовок своей секции, но не её строки: каждый
      # прогон таймера оставлял старые адреса НАД свежими, и резолв начинался с мёртвых.
      # Смоук держит идемпотентность (один блок после many прогонов) и сохранность чужих строк.
      - name: MiniMax DNS pin script smoke test
        run: bash scripts/prod-ops/minimax-dns-pin.test.sh
