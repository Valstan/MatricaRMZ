name: Build Android APK (tablet)

on:
  workflow_dispatch:
  push:
    tags:
      # Отдельный префикс: Electron-релизы идут по "v*.*.*" и НЕ должны
      # запускать сборку APK (и наоборот).
      - "android-v*.*.*"
  # Нативную часть планшетного клиента не проверяет ни один другой гейт:
  # ошибка в Gradle/манифесте/плагине видна только при сборке APK. Гоняем её
  # на PR, задевающих android-контур, а не раз в релиз.
  pull_request:
    paths:
      - "android-app/**"
      - "shared/**"
      - "electron-app/src/renderer/**"
      # main-процесс тоже попадает в сборку планшета: часть его модулей подменяют
      # шимы (`android-app/src/shims/`), а остальные, как clientAdminService,
      # собираются как есть. Без этого пути гейт слеп ровно к тому, что его ломает:
      # новый экспорт в watchdogHandshakeService прошёл PR #694 незамеченным и
      # свалил сборку APK только на релизном PR, где менялся `shared/`.
      - "electron-app/src/main/**"
      - ".github/workflows/android-apk-build.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.26.1"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Capacitor 8 компилируется под Java 21 (capacitor-android и плагин SQLite
      # оба на VERSION_21), а Gradle 8.14.3 не запускается на Java 25 — версию
      # фиксируем явно, дефолт раннера сюда не годится.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Android SDK на ubuntu-latest предустановлен (ANDROID_HOME задан,
      # лицензии приняты) — отдельный setup-android не нужен; недостающие
      # platform/build-tools Gradle дотянет сам.

      - name: Install dependencies
        run: pnpm install

      - name: Build shared
        run: pnpm -C shared build

      - name: Build web bundle
        run: pnpm -C android-app build

      # Копирует android-app/dist в нативные assets и обновляет Gradle-проекты
      # плагинов. Обязательно ПОСЛЕ vite-сборки.
      - name: Capacitor sync
        run: pnpm -C android-app exec cap sync android

      # Хранилище ключа не касается рабочего дерева: репо публичный. Ключ нужен
      # только тег-сборкам (release): НЕ-тег собирается в debug и подписывается
      # штатным debug-ключом Android (см. ниже). Ключа может не быть (секрет ещё
      # не заведён) — на теге такая сборка падает намеренно, шаг следом.
      - name: Decode keystore
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задан — релизный APK будет НЕПОДПИСАННЫМ"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/matricarmz-release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/matricarmz-release.keystore" >> "$GITHUB_ENV"

      - name: Require signing key for tag builds
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.ANDROID_KEYSTORE_FILE == '' }}
        run: |
          echo "::error::релизный тег без ключа подписи — публиковать неподписанный APK нельзя"
          exit 1

      # Подпись подхватывается signingConfig'ом в android-app/android/app/build.gradle
      # по переменным окружения (ANDROID_KEYSTORE_FILE проброшен через GITHUB_ENV).
      - name: Assemble release APK (tag builds)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android-app/android

      # НЕ-тег (PR, workflow_dispatch с ветки) собираем в DEBUG. Release без
      # ключа даёт `app-release-unsigned.apk`, который на устройство не встаёт, —
      # то есть приёмка планшетных фич по такому артефакту невозможна (поймано на
      # прогоне PR #516, см. docs/PENDING_FOLLOWUPS.md §«Большой рефакторинг»).
      # Debug подписывается штатным debug-ключом Android (AGP генерирует
      # ~/.android/debug.keystore сам) и ставится sideload'ом без секретов.
      - name: Assemble debug APK (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-app/android

      - name: Report APK
        run: ls -la android-app/android/app/build/outputs/apk/*/

      # Главная грабля прошлого захода была не в том, что APK неподписанный, а в
      # том, что по зелёному логу это не видно. Проверяем подпись явно: шаг
      # краснеет ровно тогда, когда артефакт на планшет не встанет.
      - name: Verify APK signature
        run: |
          apk=$(ls android-app/android/app/build/outputs/apk/*/*.apk | head -1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner не найден в $ANDROID_HOME/build-tools — проверку подписи пропускаем"
            exit 0
          fi
          "$apksigner" verify --print-certs "$apk"

      # На теге android-v* — GitHub Release с подписанным release-APK (раздача
      # sideload'ом, см. docs/plans/android-tablet-client-2026-08.md §Ф4). На PR и
      # ручном запуске с ветки — только debug-артефакт для проверки на планшете,
      # ничего не публикуем.
      - name: Publish release (tag builds)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Android ${GITHUB_REF_NAME}" \
            --notes "Планшетный клиент MatricaRMZ (APK для установки вручную)" \
            android-app/android/app/build/outputs/apk/release/*.apk

      # Имя артефакта говорит, что внутри debug: applicationId тот же
      # (ru.matricarmz.tablet), а ключ другой — поверх APK, подписанного иным
      # ключом (локальная сборка, будущий release), он не встанет, нужно сначала
      # удалить приложение с планшета.
      - name: Upload debug APK artifact (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: matricarmz-android-apk-debug
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
