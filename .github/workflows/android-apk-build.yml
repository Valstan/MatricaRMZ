name: Build Android APK (tablet)

on:
  workflow_dispatch:
  push:
    tags:
      # Отдельный префикс: Electron-релизы идут по "v*.*.*" и НЕ должны
      # запускать сборку APK (и наоборот).
      - "android-v*.*.*"
  # Нативную часть планшетного клиента не проверяет ни один другой гейт:
  # ошибка в Gradle/манифесте/плагине видна только при сборке APK. Гоняем её
  # на PR, задевающих android-контур, а не раз в релиз.
  pull_request:
    paths:
      - "android-app/**"
      - "shared/**"
      - "electron-app/src/renderer/**"
      - ".github/workflows/android-apk-build.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.26.1"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Capacitor 8 компилируется под Java 21 (capacitor-android и плагин SQLite
      # оба на VERSION_21), а Gradle 8.14.3 не запускается на Java 25 — версию
      # фиксируем явно, дефолт раннера сюда не годится.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Android SDK на ubuntu-latest предустановлен (ANDROID_HOME задан,
      # лицензии приняты) — отдельный setup-android не нужен; недостающие
      # platform/build-tools Gradle дотянет сам.

      - name: Install dependencies
        run: pnpm install

      - name: Build shared
        run: pnpm -C shared build

      - name: Build web bundle
        run: pnpm -C android-app build

      # Копирует android-app/dist в нативные assets и обновляет Gradle-проекты
      # плагинов. Обязательно ПОСЛЕ vite-сборки.
      - name: Capacitor sync
        run: pnpm -C android-app exec cap sync android

      # Хранилище ключа не касается рабочего дерева: репо публичный. Ключа может
      # не быть (секрет ещё не заведён) — тогда собираем НЕПОДПИСАННЫЙ APK и
      # говорим об этом вслух; на тег такая сборка не проходит (шаг ниже).
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задан — APK будет НЕПОДПИСАННЫМ и на планшет не встанет"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/matricarmz-release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/matricarmz-release.keystore" >> "$GITHUB_ENV"

      - name: Require signing key for tag builds
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.ANDROID_KEYSTORE_FILE == '' }}
        run: |
          echo "::error::релизный тег без ключа подписи — публиковать неподписанный APK нельзя"
          exit 1

      # Подпись подхватывается signingConfig'ом в android-app/android/app/build.gradle
      # по переменным окружения (ANDROID_KEYSTORE_FILE проброшен через GITHUB_ENV).
      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android-app/android

      - name: Report APK
        run: ls -la android-app/android/app/build/outputs/apk/release/

      # На теге android-v* — GitHub Release с APK (раздача sideload'ом,
      # см. docs/plans/android-tablet-client-2026-08.md §Ф4). На ручном запуске
      # с ветки — только артефакт для проверки на планшете, ничего не публикуем.
      - name: Publish release (tag builds)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Android ${GITHUB_REF_NAME}" \
            --notes "Планшетный клиент MatricaRMZ (APK для установки вручную)" \
            android-app/android/app/build/outputs/apk/release/*.apk

      - name: Upload test APK artifact (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: matricarmz-android-apk-test
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
