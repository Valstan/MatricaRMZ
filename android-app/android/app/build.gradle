apply plugin: 'com.android.application'

// Версия берётся из общего для репо файла VERSION (см. AGENTS.md §Release process) —
// чтобы APK нельзя было выпустить с номером, разошедшимся с сервером и Windows-клиентом.
// versionCode Android требует целым и строго растущим: меньший код Android считает
// откатом и обновление ставить отказывается.
//
// Схем нумерации в VERSION за жизнь проекта было две, и коды считаются по-разному:
//   CalVer `YYYY.(MM*100+DD).(HH*100+MM)` — минуты от начала 2026 года (до ~326 000);
//   `<поколение>.<выпуск>.0` — своя область НАД прежней, чтобы смена схемы не выглядела
//   откатом: миллион + поколение и номер выпуска. 3.1 → 1030001, 3.27 → 1030027, 4.1 → 1040001.
def versionNameFromFile = { ->
    return new File(rootProject.projectDir, "../../VERSION").text.trim()
}
def versionCodeFrom = { String version ->
    def generation = version =~ /^(\d{1,3})\.(\d{1,4})\.(\d+)$/
    if (generation.matches()) {
        int gen = generation[0][1] as int
        int release = generation[0][2] as int
        if (release < 1) throw new GradleException("Номер выпуска должен быть ≥ 1: ${version}")
        return 1_000_000 + gen * 10_000 + release
    }
    def calver = version =~ /^(\d{4})\.(\d{1,4})\.(\d{1,4})$/
    if (calver.matches()) {
        int year = calver[0][1] as int
        int mmdd = calver[0][2] as int
        int hhmm = calver[0][3] as int
        def day = java.time.LocalDate.of(year, (int) (mmdd / 100), mmdd % 100)
        return ((year - 2026) * 366 + day.dayOfYear) * 1440 + (int) (hhmm / 100) * 60 + hhmm % 100
    }
    throw new GradleException("VERSION не в известном формате версии: ${version}")
}

android {
    namespace = "ru.matricarmz.tablet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.matricarmz.tablet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionName versionNameFromFile()
        versionCode versionCodeFrom(versionName)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Ключ подписи живёт только в секретах CI и НИКОГДА в репо (он публичный).
    // Один и тот же ключ обязателен для всех сборок: Android откажется ставить
    // обновление, подписанное другим. Без переменных окружения (локальная
    // сборка) release-конфиг просто не подставляется — получится неподписанный
    // APK, который на устройство не поставить, и это видно сразу.
    signingConfigs {
        release {
            if (System.getenv("ANDROID_KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
