<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Матрица РМЗ — запуск</title>
    <style>
      :root {
        --accent: #2563eb;
        --muted: #6b7280;
        --ink: #0f172a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 0; padding: 0; color: var(--ink);
        position: relative; overflow: hidden; user-select: none;
        background: linear-gradient(160deg, #f8fafc 0%, #eef2ff 100%);
      }
      .decor { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
      .part { position: absolute; opacity: 0.10; color: #1e3a8a; }
      .part svg { display: block; }
      .p1 { top: 4%; left: 4%; animation: drift1 13s ease-in-out infinite; }
      .p2 { top: 52%; right: 5%; animation: drift2 17s ease-in-out infinite; }
      .p3 { top: 70%; left: 17%; animation: drift1 19s ease-in-out infinite; opacity: 0.07; }
      .spin { display: block; animation: spin 9s linear infinite; }
      .spin-rev { display: block; animation: spin 12s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes drift1 { 0%,100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(-12px) translateX(7px); } }
      @keyframes drift2 { 0%,100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(10px) translateX(-8px); } }

      .content { position: relative; z-index: 1; height: 100%; padding: 18px 22px 16px; display: flex; flex-direction: column; }
      .head { font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); }
      .sub { margin-top: 2px; font-size: 13px; color: var(--muted); }
      .stage { margin-top: 16px; font-size: 19px; font-weight: 600; line-height: 1.3; min-height: 50px; }
      .note { font-size: 12.5px; color: var(--muted); min-height: 17px; line-height: 1.35; }
      .bar { margin-top: 12px; height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; position: relative; }
      .run {
        position: absolute; top: 0; left: -42%; width: 42%; height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, #2563eb, #7c3aed);
        animation: run 1.4s ease-in-out infinite;
      }
      @keyframes run { 0% { left: -42%; } 100% { left: 100%; } }
      .hint { margin-top: auto; padding-top: 12px; font-size: 11.5px; color: var(--muted); line-height: 1.35; }

      @media (prefers-reduced-motion: reduce) {
        .part, .spin, .spin-rev { animation: none !important; }
        .run { animation: none !important; left: 0 !important; width: 100% !important; opacity: 0.55; }
        .decor { opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div class="decor" aria-hidden="true" id="decor"></div>
    <div class="content">
      <div class="head">Матрица РМЗ</div>
      <div class="sub">Программа запускается</div>
      <div class="stage" id="stage" aria-live="polite">Запускаю программу</div>
      <div class="note" id="note"></div>
      <div class="bar"><div class="run"></div></div>
      <div class="hint">
        Не закрывайте это окно. Если запуск идёт долго — программа приводит в порядок базу данных;
        дождитесь окончания.
      </div>
    </div>

    <script>
      (function () {
        var GEAR =
          '<svg width="54" height="54" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm0 6a2 2 0 110-4 2 2 0 010 4z"/><path d="M21 12l-2-1 1-2-2-2-2 1-1-2h-2l-1 2-2-1-2 2 1 2-2 1v2l2 1-1 2 2 2 2-1 1 2h2l1-2 2 1 2-2-1-2 2-1v-2z" opacity=".55"/></svg>';
        var PISTON =
          '<svg width="36" height="48" viewBox="0 0 24 32" fill="currentColor"><rect x="7" y="1" width="10" height="13" rx="2"/><rect x="9" y="14" width="6" height="10"/><circle cx="12" cy="27" r="4"/></svg>';

        var decor = document.getElementById('decor');
        if (decor) {
          decor.innerHTML =
            '<span class="part p1"><span class="spin">' + GEAR + '</span></span>' +
            '<span class="part p2"><span class="spin-rev">' + GEAR + '</span></span>' +
            '<span class="part p3">' + PISTON + '</span>';
        }

        function setText(id, value) {
          var el = document.getElementById(id);
          if (el) el.textContent = value;
        }

        function render(state) {
          state = state || {};
          var stage = typeof state.stage === 'string' && state.stage ? state.stage : 'Запускаю программу';
          var note = typeof state.note === 'string' ? state.note : '';
          setText('stage', stage);
          setText('note', note);
        }

        var api = window.matricaStartup;
        if (api && typeof api.onStage === 'function') api.onStage(render);
      })();
    </script>
  </body>
</html>
